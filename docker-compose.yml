services:
  # 1. База данных (Postgres)
  postgres_db:
    image: postgres:15-alpine
    container_name: rex_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rex_db}
      POSTGRES_HOST_AUTH_METHOD: trust 
    ports:
      # ПРИВЯЗЫВАЕМ К LOCALHOST. Теперь ваш SSH-туннель будет работать, 
      # но из интернета напрямую к базе никто не подключится.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Пулер соединений
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: rex_pgbouncer
    environment:
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=postgres_db
      - DB_NAME=${POSTGRES_DB:-rex_db}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - AUTH_TYPE=trust 
    # ports: <-- УДАЛЯЕМ (внешний доступ не нужен, бот общается внутри сети Docker)
    depends_on:
      - postgres_db
    restart: always

  # 2. Очереди (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rex_rabbitmq
    restart: always
    # ports: <-- УДАЛЯЕМ (внешний доступ не нужен, всё общение внутри Docker)
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_PROMETHEUS_RETURN_PER_OBJECT_METRICS: "true"

  # 3. Кэш (Redis)
  redis:
    image: redis:7-alpine
    container_name: rex_redis
    restart: always
    # Гарантируем, что он всегда Мастер и очищаем следы взлома
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "no", "one"]
    # ports: <-- УДАЛЯЕМ (внешний доступ НЕ НУЖЕН СОВСЕМ)
    volumes:
      - redis_data:/data

  # --- ПРИЛОЖЕНИЕ (PYTHON) ---
  # У всех воркеров и бота удаляем ports (у вас их и не было, это правильно)
  bot_polling:
    build: .
    container_name: rex_bot
    restart: always
    command: python -m src.bot.main
    env_file:
      - .env
    depends_on:
      - postgres_db
      - redis
      - rabbitmq

  worker_ai:
    build: .
    container_name: rex_worker_ai
    restart: always
    command: python -m src.workers.ai_worker
    env_file:
      - .env
    depends_on:
      - postgres_db
      - redis
      - rabbitmq

  worker_sender:
    build: .
    container_name: rex_worker_sender
    restart: always
    command: python -m src.workers.sender_worker
    env_file:
      - .env
    depends_on:
      - rabbitmq

  worker_scheduler:
    build: .
    container_name: rex_scheduler
    restart: always
    command: python -m src.workers.scheduler
    env_file:
      - .env
    depends_on:
      - postgres_db
      - redis
      - rabbitmq

  # --- МОНИТОРИНГ ---
  loki:
    image: grafana/loki:2.9.2
    container_name: rex_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    restart: always

  promtail:
    image: grafana/promtail:2.9.2
    container_name: rex_promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    restart: always
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: rex_prometheus
    # ports: <-- УДАЛЯЕМ (Grafana забирает метрики внутри сети Docker)
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: rex_cadvisor
    # ports: <-- УДАЛЯЕМ (Prometheus забирает метрики внутри сети Docker)
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: always

  # 12. Grafana (ЕДИНСТВЕННОЕ, ЧТО ОСТАЕТСЯ ОТКРЫТЫМ)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: rex_grafana
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin} 
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  rabbit_data:
  redis_data:
  prometheus_data:
  grafana_data: